<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBgRag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="490" rx="14" fill="#0a0e1a" stroke="#1e293b" stroke-width="2"/>
  
  <text x="550" y="45" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Multi-Agent Quality Check Pipeline &amp; Self-Correction Flow</text>
  <text x="550" y="70" fill="#64748b" font-family="sans-serif" font-size="13" text-anchor="middle">Self-Correcting RAG with 4 Autonomous Verification Gates &amp; Grounded Citations</text>

  <!-- Agent 1: Query Analyzer -->
  <g transform="translate(40, 110)">
    <rect width="180" height="150" rx="10" fill="url(#boxBgRag)" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="90" cy="40" r="22" fill="#064e3b" opacity="0.6"/>
    <text x="90" y="46" fill="#34d399" font-family="sans-serif" font-size="20" text-anchor="middle">🔍</text>
    <text x="90" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Query Agent</text>
    <text x="90" y="108" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Intent &amp; Decomposition</text>
    <text x="90" y="128" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Multi-Hop Expansion</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="220" y1="185" x2="255" y2="185" stroke="url(#flowGrad)" stroke-width="3"/>
  <polygon points="255,185 248,180 248,190" fill="#06b6d4"/>

  <!-- Retrieval Layer -->
  <g transform="translate(260, 110)">
    <rect width="180" height="150" rx="10" fill="url(#boxBgRag)" stroke="#06b6d4" stroke-width="1.8"/>
    <circle cx="90" cy="40" r="22" fill="#155e75" opacity="0.6"/>
    <text x="90" y="46" fill="#22d3ee" font-family="sans-serif" font-size="20" text-anchor="middle">⚡</text>
    <text x="90" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Hybrid Retrieval</text>
    <text x="90" y="108" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">BM25 + Semantic Vector</text>
    <text x="90" y="128" fill="#22d3ee" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Reciprocal Rank Fusion</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="440" y1="185" x2="475" y2="185" stroke="url(#flowGrad)" stroke-width="3"/>
  <polygon points="475,185 468,180 468,190" fill="#06b6d4"/>

  <!-- Agent 2: Relevance Evaluator -->
  <g transform="translate(480, 110)">
    <rect width="180" height="150" rx="10" fill="url(#boxBgRag)" stroke="#3b82f6" stroke-width="1.8"/>
    <circle cx="90" cy="40" r="22" fill="#1e3a8a" opacity="0.6"/>
    <text x="90" y="46" fill="#60a5fa" font-family="sans-serif" font-size="20" text-anchor="middle">🎯</text>
    <text x="90" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Relevance Agent</text>
    <text x="90" y="108" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Context Fact Scorer</text>
    <text x="90" y="128" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Filters Irrelevant Noise</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="660" y1="185" x2="695" y2="185" stroke="url(#flowGrad)" stroke-width="3"/>
  <polygon points="695,185 688,180 688,190" fill="#a855f7"/>

  <!-- Agent 3: Faithfulness Auditor -->
  <g transform="translate(700, 110)">
    <rect width="180" height="150" rx="10" fill="url(#boxBgRag)" stroke="#a855f7" stroke-width="1.8"/>
    <circle cx="90" cy="40" r="22" fill="#581c87" opacity="0.6"/>
    <text x="90" y="46" fill="#c084fc" font-family="sans-serif" font-size="20" text-anchor="middle">🛡️</text>
    <text x="90" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Faithfulness Agent</text>
    <text x="90" y="108" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Hallucination Auditor</text>
    <text x="90" y="128" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Grounded Citations</text>
  </g>

  <!-- Arrow 4 -->
  <line x1="880" y1="185" x2="915" y2="185" stroke="url(#flowGrad)" stroke-width="3"/>
  <polygon points="915,185 908,180 908,190" fill="#eab308"/>

  <!-- Agent 4: Answer Quality -->
  <g transform="translate(920, 110)">
    <rect width="150" height="150" rx="10" fill="url(#boxBgRag)" stroke="#eab308" stroke-width="1.8"/>
    <circle cx="75" cy="40" r="22" fill="#713f12" opacity="0.6"/>
    <text x="75" y="46" fill="#fde047" font-family="sans-serif" font-size="20" text-anchor="middle">✨</text>
    <text x="75" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Quality Agent</text>
    <text x="75" y="108" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Completeness &amp; Tone</text>
    <text x="75" y="128" fill="#fde047" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Final Scorecard</text>
  </g>

  <!-- Feedback / Corrective Loop Line -->
  <g transform="translate(0, 0)">
    <path d="M570,260 L570,285 L130,285 L130,260" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
    <polygon points="130,260 125,268 135,268" fill="#ef4444"/>
    <rect x="270" y="274" width="220" height="22" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="380" y="289" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🔄 Auto Re-Query on Low Relevance</text>
  </g>

  <!-- Lower summary row -->
  <g transform="translate(40, 330)">
    <rect width="1030" height="120" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5"/>
    
    <g transform="translate(40, 35)">
      <text x="0" y="0" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold">🛡️ Zero Hallucinations</text>
      <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">Claims unsupported by source text are intercepted and rejected prior to output delivery.</text>
    </g>

    <g transform="translate(380, 35)">
      <text x="0" y="0" fill="#22d3ee" font-family="sans-serif" font-size="14" font-weight="bold">⚖️ Hybrid RRF Retrieval</text>
      <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">Blends BM25 exact lexical matches with dense semantic cosine vectors for high recall.</text>
    </g>

    <g transform="translate(720, 35)">
      <text x="0" y="0" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold">📊 Granular Scorecard</text>
      <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12">Every query outputs full latency, confidence metrics, and step-by-step agent traces.</text>
    </g>
  </g>
</svg>