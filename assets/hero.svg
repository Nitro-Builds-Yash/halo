<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540">
  <style>
    :root {
      --panel: #f6f8fa; --panel-2: #ffffff; --ink: #0d1117; --muted: #57606a;
      --line: #d0d7de; --accent: #0969da; --accent-soft: #ddf4ff; --good: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --panel: #0d1117; --panel-2: #161b22; --ink: #f0f6fc; --muted: #8b949e;
        --line: #30363d; --accent: #58a6ff; --accent-soft: #0c2d4a; --good: #3fb950;
      }
    }
    .sans { font-family: Geist, "Avenir Next", "Segoe UI", system-ui, sans-serif; }
    .mono { font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes halo { 0% { opacity: 0.34; transform: scale(0.88); } 72%, 100% { opacity: 0; transform: scale(1.18); } }
    @keyframes brand { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes wave { to { stroke-dashoffset: -40; } }
    @keyframes pulse-ring { 0% { r:8px; opacity:.65; stroke-width:2px; } 72%,100% { r:18px; opacity:0; stroke-width:1px; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .blink { animation: blink 2.4s ease-in-out infinite; }
    .halo { animation: halo 3.4s cubic-bezier(.2,.72,.2,1) infinite; transform-origin: 880px 270px; }
    .brand { animation: brand 5.2s infinite; }
    .wave { stroke-dasharray: 8 12; animation: wave 2.1s linear infinite; }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  
  <rect width="100%" height="100%" rx="28" fill="var(--panel)" stroke="var(--line)" stroke-width="1"/>
  
  <line x1="0" y1="116" x2="1200" y2="116" stroke="var(--line)" stroke-width="1"/>
  <line x1="0" y1="458" x2="1200" y2="458" stroke="var(--line)" stroke-width="1"/>
  
  <!-- Top bar -->
  <circle cx="74" cy="64" r="6" fill="var(--good)" class="blink" />
  <text x="96" y="69" class="mono" fill="var(--muted)" font-size="14">AGENTS ACTIVE</text>
  <text x="1050" y="69" class="mono" fill="var(--muted)" font-size="14" text-anchor="end">SELF-CORRECTIVE RAG</text>
  <rect x="1080" y="52" width="40" height="24" rx="12" fill="var(--accent-soft)"/>
  <text x="1100" y="69" class="mono" fill="var(--accent)" font-size="14" text-anchor="middle">v1</text>
  
  <!-- Hero text -->
  <text x="74" y="210" class="sans" font-weight="bold" font-size="70" fill="var(--ink)">halo</text>
  <text x="74" y="272" class="sans" font-size="36" fill="var(--accent)">ask anything. retrieve truth.</text>
  <text x="74" y="320" class="sans" font-size="24" fill="var(--muted)">A self-corrective agentic RAG pipeline with 4 AI quality gates.</text>
  
  <!-- Pill row -->
  <g transform="translate(74, 374)">
    <rect width="450" height="42" rx="21" fill="var(--panel-2)" stroke="var(--line)"/>
    <text x="225" y="26" class="mono" font-size="14" fill="var(--ink)" text-anchor="middle">HYBRID RETRIEVAL · HALLUCINATION GUARD · MULTI-AGENT</text>
  </g>
  
  <!-- Right side visual -->
  <circle cx="880" cy="270" r="132" fill="none" stroke="var(--accent)" stroke-width="2" class="halo"/>
  <circle cx="880" cy="270" r="100" fill="var(--accent-soft)" opacity="0.2"/>
  <g class="brand" transform="translate(880, 270)">
    <rect x="-60" y="-60" width="120" height="120" rx="24" fill="var(--panel-2)" stroke="var(--accent)" stroke-width="2"/>
    <text x="0" y="-5" class="sans" font-size="48" font-weight="bold" fill="var(--accent)" text-anchor="middle">4</text>
    <text x="0" y="30" class="mono" font-size="16" fill="var(--accent)" text-anchor="middle">AGENTS</text>
  </g>
  
  <!-- Bottom bar -->
  <text x="72" y="500" class="mono" fill="var(--muted)" font-size="14">BM25 + VECTOR · FAITHFULNESS VERIFIED · SELF-CORRECTIVE</text>
  <path d="M 800 500 Q 820 480 840 500 T 880 500 T 920 500 T 960 500 T 1000 500 T 1040 500 T 1080 500 T 1120 500 T 1160 500" fill="none" stroke="var(--accent)" stroke-width="2" class="wave"/>
</svg>