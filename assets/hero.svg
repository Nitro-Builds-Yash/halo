<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGradRag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glowRag" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradRag)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- Visual Wave / Agent Circuit Lines -->
  <g transform="translate(600, 260)">
    <path d="M-500,0 Q-350,-50 -200,0 T100,0 T400,0 T500,0" fill="none" stroke="url(#accentGradRag)" stroke-width="2.5" opacity="0.3"/>
    <path d="M-400,0 Q-250,50 -100,0 Q50,-60 200,0 Q350,60 450,0" fill="none" stroke="url(#accentGradRag)" stroke-width="3" filter="url(#glowRag)"/>
  </g>

  <!-- Left Icon Visual -->
  <g transform="translate(80, 105)">
    <rect width="80" height="80" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="40" cy="40" r="24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="5 3"/>
    <path d="M30,40 L37,47 L52,32" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Header & Title -->
  <g transform="translate(190, 110)">
    <rect x="0" y="-35" width="250" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="14" cy="-22" r="5" fill="#34d399"/>
    <text x="26" y="-18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SELF-CORRECTIVE AGENTIC RAG</text>

    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Agentic RAG QA System
    </text>
    <text x="0" y="68" fill="url(#accentGradRag)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">
      Multi-Agent Quality Check Architecture • Hybrid Retrieval • Zero Hallucination Guardrails
    </text>
    <text x="0" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">
      Four specialized AI quality check agents evaluate intent, context relevance, fact faithfulness, and answer quality.
    </text>
  </g>

  <!-- Right Radar Score Visual -->
  <g transform="translate(1010, 80)">
    <rect width="130" height="130" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <circle cx="65" cy="65" r="40" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="65" cy="65" r="25" fill="none" stroke="#334155" stroke-width="1.5"/>
    <polygon points="65,30 95,65 65,95 40,65" fill="#10b981" fill-opacity="0.35" stroke="#10b981" stroke-width="2"/>
    <text x="65" y="112" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">QUALITY: 98%</text>
  </g>
</svg>