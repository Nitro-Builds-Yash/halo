[package]
name = "halo-native"
version = "0.2.0"
edition.workspace = true
description = "Native (Rust) hot paths for halo: BM25, tokenizer, evidence scoring, rank fusion"
license.workspace = true
publish = false

[lib]
name = "halo_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py311"] }
rayon = "1.10"

[features]
default = []
extension-module = ["pyo3/extension-module"]

