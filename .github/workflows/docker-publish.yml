name: Publish Docker image

# Builds deploy/Dockerfile (with the Rust extension) and pushes it to GitHub Container Registry:
#   ghcr.io/nitro-builds-yash/halo:<version>, :<major.minor> and :latest
# It runs automatically after each release (called from release.yml), or by hand:
# Actions → "Publish Docker image" → Run workflow.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/halo/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            RERANK=0
            NATIVE=1
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.minor }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=halo
            org.opencontainers.image.description=Corrective RAG with verified, cited answers: web app, API and Rust-accelerated search
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: |
          docker run -d --name halo -p 8000:8000 ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health | grep -q '"version":"${{ steps.version.outputs.version }}"'

      - name: Summary
        run: |
          {
            echo "### Published ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"
            echo '```'
            echo "docker run -p 8000:8000 -e OPENAI_API_KEY=sk-... ${{ steps.version.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
