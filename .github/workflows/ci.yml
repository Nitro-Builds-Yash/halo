name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      CHROMA_PERSIST_DIR: /tmp/halo_chroma
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (without the torch reranker, to keep CI fast)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  native:
    name: rust extension
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      CHROMA_PERSIST_DIR: /tmp/halo_chroma
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust checks
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build and install halo-native
        run: |
          pip install -e ".[dev]" maturin
          pip install ./rust
          python -c "import halo_native; print('halo_native', halo_native.__version__)"
      - name: Test with the Rust backend (incl. parity vs rank-bm25)
        run: pytest -q
      - name: Benchmark (Rust vs pure Python)
        run: python benchmarks/bm25_bench.py --docs 20000 --queries 200

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build (Rust extension on, torch off)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: halo:ci
          build-args: |
            RERANK=0
            NATIVE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the API and check it uses the Rust backend
        run: |
          docker run -d --name halo -p 8000:8000 -e OPENAI_API_KEY= halo:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health | tee health.json
          grep -q '"keyword_backend":"rust' health.json
          docker exec halo halo --version
      - name: Logs on failure
        if: failure()
        run: docker logs halo || true
